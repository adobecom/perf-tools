# perf-ab default mode: real Lighthouse 13.6.0 (PageSpeed mobile, lr-mobile preset) on GitHub-hosted runners whose
# egress is verified US before anything is measured. Manual workflow_dispatch only (CLI or "Run workflow"); no schedule.
#
# Exactly one of: spec (encoded by the perf-ab CLI), config (repository experiments/**.json) or url (one page,
# unchanged). runs = N gives N parallel matrix jobs; each measures ONE complete cold before/after pair on its own VM.
# The aggregate job combines complete pairs only (medians + median per-pair delta) into perf-ab-<request>.
# All inputs reach scripts only through environment variables and are validated by lib/pagespeed/prepare.mjs.
name: perf-ab
run-name: perf-ab ${{ inputs.request_id || inputs.config || inputs.url }}

on:
  workflow_dispatch:
    inputs:
      config:
        description: Experiment config in this repository, e.g. experiments/acrobat-plans.json
        required: false
        type: string
      url:
        description: One https://*.adobe.com page (unchanged unless a PR input is supplied)
        required: false
        type: string
      runs:
        description: Pairs (1 = smoke, 3 = full; 1-10). Empty = config default
        required: false
        type: string
      milo_pr:
        description: Optional adobecom/milo PR number; overrides the config's Milo PR reference
        required: false
        type: string
      mas_pr:
        description: Optional adobecom/mas PR number; overrides the config's MAS PR reference
        required: false
        type: string
      spec:
        description: (CLI) gzip+base64 spec generated by the perf-ab CLI
        required: false
        type: string
      request_id:
        description: (CLI) request id generated by the perf-ab CLI; empty = gh-run-<run id>
        required: false
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      spec: ${{ steps.prepare.outputs.spec }}
      request_id: ${{ steps.prepare.outputs.request_id }}
      runs: ${{ steps.prepare.outputs.runs }}
      pairs: ${{ steps.prepare.outputs.pairs }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - id: prepare
        name: Validate inputs
        env:
          SPEC: ${{ inputs.spec }}
          CONFIG: ${{ inputs.config }}
          URL: ${{ inputs.url }}
          RUNS: ${{ inputs.runs }}
          REQUEST_ID: ${{ inputs.request_id }}
          MILO_PR: ${{ inputs.milo_pr }}
          MAS_PR: ${{ inputs.mas_pr }}
        run: node lib/pagespeed/prepare.mjs

  measure:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        pair: ${{ fromJSON(needs.prepare.outputs.pairs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Locate Chrome
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable)"
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
          "$chrome" --version
      - name: Lighthouse pair (verified US egress)
        env:
          SPEC: ${{ needs.prepare.outputs.spec }}
          REQUEST_ID: ${{ needs.prepare.outputs.request_id }}
          PAIR: ${{ matrix.pair }}
        run: node lib/pagespeed/job.mjs --out "$RUNNER_TEMP/perf-ab-out"
      - name: Upload pair reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-ab-${{ needs.prepare.outputs.request_id }}-pair${{ matrix.pair }}
          path: ${{ runner.temp }}/perf-ab-out
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: [prepare, measure]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download pair artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: perf-ab-${{ needs.prepare.outputs.request_id }}-pair*
          path: ${{ runner.temp }}/pairs
        continue-on-error: true
      - name: Aggregate complete pairs
        env:
          REQUEST_ID: ${{ needs.prepare.outputs.request_id }}
          RUNS: ${{ needs.prepare.outputs.runs }}
        run: node lib/pagespeed/aggregate.mjs --pairs-dir "$RUNNER_TEMP/pairs" --expected "$RUNS" --request-id "$REQUEST_ID" --out "$RUNNER_TEMP/perf-ab-out"
      - name: Upload combined reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-ab-${{ needs.prepare.outputs.request_id }}
          path: ${{ runner.temp }}/perf-ab-out
          if-no-files-found: error
          retention-days: 90
      - name: Upload results summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-ab-${{ needs.prepare.outputs.request_id }}-results
          path: ${{ runner.temp }}/perf-ab-out/results.json
          if-no-files-found: error
          retention-days: 90
