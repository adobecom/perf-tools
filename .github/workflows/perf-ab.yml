# Dispatched by the perf-ab CLI (bin/perf-ab.mjs). Manual workflow_dispatch only; no schedule.
# Runs real Lighthouse 13.6.0 (PageSpeed mobile profile) after verifying the runner's egress is in the US.
name: perf-ab
run-name: perf-ab ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Request id generated by the perf-ab CLI ([A-Za-z0-9-]{8,64})
        required: true
        type: string
      spec:
        description: gzip+base64 perf-ab measurement spec generated by the perf-ab CLI
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: perf-ab-${{ github.run_id }}

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Locate Chrome
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable)"
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
          "$chrome" --version
      - name: Lighthouse comparison (verified US egress)
        env:
          SPEC: ${{ inputs.spec }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: node lib/pagespeed/job.mjs --out "$RUNNER_TEMP/perf-ab-out"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-ab-${{ inputs.request_id }}
          path: ${{ runner.temp }}/perf-ab-out
          if-no-files-found: error
          retention-days: 30
